name: boardwell
description: >-
  Boardwell — Offline-first chess playing and hybrid multi-coach learning app
  built for universal Android compatibility (Android 7 through Android 16/17+).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Chess Core & Interactive Board
  chessground: ^10.3.0
  dartchess: ^0.14.0
  fast_immutable_collections: ^11.0.4

  # 16 KB Page-Size Aligned Stockfish Engine
  stockfish_flutter_plus: ^1.0.1

  # On-Device LLM Inference (MediaPipe .task/.bin — supports armeabi-v7a, arm64-v8a, x86_64, minSdk 24)
  flutter_edge_ai: ^2.7.2
  flutter_edge_ai_mediapipe: ^1.2.6

  # Storage, Secure Keys & Networking
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.5.3
  connectivity_plus: ^6.1.4
  http: ^1.3.0
  uuid: ^4.5.1

  # Storage Access Framework (Zero legacy storage permissions)
  file_picker: ^10.1.2
  share_plus: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/openings_eco.json
    - assets/data/puzzles_offline.json
