name: Build Boardwell Android APKs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Analyze & Build Universal + Split APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up latest stable Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify Flutter & Java versions
        run: |
          flutter --version
          java -version

      - name: Generate Android launcher icons if missing
        run: |
          python3 - << 'EOF'
          import struct, zlib
          from pathlib import Path

          def make_png(size):
              raw = bytearray()
              for y in range(size):
                  raw.append(0)
                  for x in range(size):
                      cell = ((x * 4) // size + (y * 4) // size) % 2
                      if cell == 0:
                          raw.extend((27, 94, 32, 255))
                      else:
                          raw.extend((241, 248, 233, 255))
              def chunk(tag, data):
                  return struct.pack('>I', len(data)) + tag + data + struct.pack('>I', zlib.crc32(tag + data) & 0xffffffff)
              ihdr = struct.pack('>IIBBBBB', size, size, 8, 6, 0, 0, 0)
              return b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', ihdr) + chunk(b'IDAT', zlib.compress(bytes(raw))) + chunk(b'IEND', b'')

          sizes = {'mipmap-mdpi': 48, 'mipmap-hdpi': 72, 'mipmap-xhdpi': 96, 'mipmap-xxhdpi': 144, 'mipmap-xxxhdpi': 192}
          base = Path('android/app/src/main/res')
          for folder, sz in sizes.items():
              out = base / folder / 'ic_launcher.png'
              if not out.exists():
                  out.parent.mkdir(parents=True, exist_ok=True)
                  out.write_bytes(make_png(sz))
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Patch legacy jcenter() in cached Flutter plugins for Gradle 9
        run: |
          python3 - << 'EOF'
          import os
          from pathlib import Path

          pub_cache = Path(os.environ.get('PUB_CACHE', os.path.expanduser('~/.pub-cache')))
          hosted = pub_cache / 'hosted' / 'pub.dev'
          patched = 0
          if hosted.exists():
              for gradle_file in hosted.glob('*/android/build.gradle'):
                  text = gradle_file.read_text(errors='ignore')
                  if 'jcenter()' in text:
                      gradle_file.write_text(text.replace('jcenter()', 'mavenCentral()'))
                      print(f'Patched jcenter() -> mavenCentral() in {gradle_file}')
                      patched += 1
          print(f'Total plugins patched: {patched}')
          EOF

      - name: Run static analysis
        run: flutter analyze --no-fatal-infos

      - name: Run unit tests
        run: flutter test

      - name: Build Universal Multi-ABI Release APK
        run: flutter build apk --release --target-platform=android-arm,android-arm64,android-x64

      - name: Build Split Per-ABI Release APKs (armeabi-v7a, arm64-v8a, x86_64)
        run: flutter build apk --release --split-per-abi --target-platform=android-arm,android-arm64,android-x64

      - name: Stage APK artifacts with descriptive names
        run: |
          mkdir -p release-apks
          cp build/app/outputs/flutter-apk/app-release.apk release-apks/Boardwell-universal-release.apk
          for abi in armeabi-v7a arm64-v8a x86_64; do
            if [ -f "build/app/outputs/flutter-apk/app-${abi}-release.apk" ]; then
              cp "build/app/outputs/flutter-apk/app-${abi}-release.apk" "release-apks/Boardwell-${abi}-release.apk"
            fi
          done
          ls -lh release-apks/

      - name: Upload Universal APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Boardwell-Universal-APK
          path: release-apks/Boardwell-universal-release.apk
          retention-days: 30

      - name: Upload Split Per-ABI APKs artifact
        uses: actions/upload-artifact@v4
        with:
          name: Boardwell-Split-ABI-APKs
          path: |
            release-apks/Boardwell-armeabi-v7a-release.apk
            release-apks/Boardwell-arm64-v8a-release.apk
            release-apks/Boardwell-x86_64-release.apk
          retention-days: 30
