name: Build Boardwell Android APKs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Analyze & Build Universal + Split APKs
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up latest stable Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify Flutter & Java versions
        run: |
          flutter --version
          java -version

      - name: Install dependencies
        run: flutter pub get

      - name: Run static analysis
        run: flutter analyze --no-fatal-infos

      - name: Run unit tests
        run: flutter test

      - name: Build Universal Multi-ABI Release APK
        run: flutter build apk --release

      - name: Build Split Per-ABI Release APKs (armeabi-v7a, arm64-v8a, x86_64)
        run: flutter build apk --release --split-per-abi

      - name: Stage APK artifacts with descriptive names
        run: |
          mkdir -p release-apks
          cp build/app/outputs/flutter-apk/app-release.apk release-apks/Boardwell-universal-release.apk
          for abi in armeabi-v7a arm64-v8a x86_64; do
            if [ -f "build/app/outputs/flutter-apk/app-${abi}-release.apk" ]; then
              cp "build/app/outputs/flutter-apk/app-${abi}-release.apk" "release-apks/Boardwell-${abi}-release.apk"
            fi
          done
          ls -lh release-apks/

      - name: Upload Universal APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Boardwell-Universal-APK
          path: release-apks/Boardwell-universal-release.apk
          retention-days: 30

      - name: Upload Split Per-ABI APKs artifact
        uses: actions/upload-artifact@v4
        with:
          name: Boardwell-Split-ABI-APKs
          path: |
            release-apks/Boardwell-armeabi-v7a-release.apk
            release-apks/Boardwell-arm64-v8a-release.apk
            release-apks/Boardwell-x86_64-release.apk
          retention-days: 30
