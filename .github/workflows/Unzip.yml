name: Unzip Project

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  unzip:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Unzip and move project files to root
        run: |
          shopt -s nullglob
          zips=(*.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "No .zip file found in repo root!"
            exit 1
          fi
          unzip -o "${zips[0]}" -d extracted_temp
          PUBSPEC=$(find extracted_temp -name "pubspec.yaml" | head -n 1)
          if [ -z "$PUBSPEC" ]; then
            echo "pubspec.yaml not found inside zip!"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PUBSPEC")
          rsync -a --exclude='.git' --exclude='extracted_temp' "$PROJECT_DIR"/ .
          rm -rf extracted_temp "${zips[0]}"

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Extract Flutter project files"
          git push
